<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>봉서 캘린더</title></head><body><div class="shell"><aside><div class="brand">▦ <span>봉서 캘린더</span></div><p class="sub">학교와 나의 일정을 한눈에</p><button class="primary" id="add">＋ 일정 추가</button><div class="sideblock"><strong>일정 보기</strong><button class="nav active" data-filter="all">전체 일정</button><button class="nav" data-filter="school">학교 일정</button><button class="nav" data-filter="personal">개인 일정</button></div><div class="sideblock"><strong>데이터 관리</strong><button class="nav" id="export">↓ 개인 일정 백업</button><label class="nav file">↑ 백업 가져오기<input type="file" id="import" accept="application/json" hidden></label></div><div class="schoolinfo"><strong>학교 일정 연동</strong><p id="school-status">학교 학사일정 확인 중…</p><a href="https://school.jbedu.kr/bongseo-m/M010302/index.do" target="_blank" rel="noopener">공식 학사일정 보기 ↗</a><button class="nav" id="school-refresh" type="button">↻ 학교 일정 새로고침</button><p class="small">학교 홈페이지 공개 학사일정만 표시합니다. 연결 실패 시 마지막으로 받은 데이터를 유지합니다.</p></div></aside><main><header><div><h1>일정 관리</h1><p id="today-caption"></p></div><button class="mobileAdd" id="add-mobile">＋ 추가</button></header><div class="toolbar"><div class="monthnav"><button id="prev">‹</button><h2 id="month-title"></h2><button id="next">›</button><button class="today" id="today">오늘</button></div><div class="righttools"><label class="search">⌕ <input id="search" placeholder="일정 검색"></label><div class="switch"><button id="monthly" class="chosen">월</button><button id="weekly">주</button></div></div></div><div class="calendar"><div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cells" id="cells"></div></div><section class="below"><div class="panel"><h3 id="selected-title"></h3><div id="selected-events"></div></div><div class="panel"><h3>다가오는 7일</h3><div id="upcoming"></div></div></section></main></div><div class="overlay" id="modal" style="display:none"><form class="dialog" id="event-form"><div class="dialoghead"><h2 id="form-title">일정 추가</h2><button type="button" id="close">×</button></div><label>일정 제목<input id="title" required placeholder="예: 학년 협의회"></label><div class="formrow"><label>시작 날짜<input type="date" id="date" required></label><label>종료 날짜 (선택)<input type="date" id="endDate"></label></div><label>시간 (선택)<input type="time" id="time"></label><div class="formrow"><label>반복<select id="repeat"><option value="none">반복 안 함</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option><option value="yearly">매년</option></select></label><label>반복 종료 (선택)<input type="date" id="repeatUntil"></label></div><label>메모<textarea id="note" rows="3"></textarea></label><div class="actions"><button type="button" class="danger" id="delete">삭제</button><button type="button" id="cancel">취소</button><button class="primary" type="submit">저장</button></div></form></div><script src="/app.js" defer></script></body></html>
